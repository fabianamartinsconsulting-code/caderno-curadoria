<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Curadoria de Moda Brasileira — CRM</title>
<meta name="theme-color" content="#2E2A26" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2E2A26;
    --ink-soft:#4a453d;
    --paper:#FBF6EA;
    --paper-alt:#FFF8E7;
    --card:#FFFFFF;
    --gold:#C9A24B;
    --gold-deep:#A9812F;
    --sage:#6E9887;
    --sage-deep:#4F7565;
    --rust:#B4592E;
    --line:#E4DBC8;
    --shadow: 0 2px 14px rgba(46,42,38,0.08);
    --radius: 14px;
    --display: 'Playfair Display', serif;
    --body: 'Inter', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--body);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  ::selection{background:var(--gold); color:var(--ink);}

  #app{max-width:640px;margin:0 auto;min-height:100%;}
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:var(--ink); color:var(--paper);
    padding:18px 20px 16px;
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:3px solid var(--gold);
  }
  header.topbar .brand{
    font-family:var(--display); font-weight:600; font-size:19px; letter-spacing:.2px;
  }
  header.topbar .brand small{
    display:block; font-family:var(--body); font-weight:400; font-size:10.5px;
    letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-top:2px;
  }
  header.topbar button.icon-btn{
    background:none;border:none;color:var(--paper); font-size:20px; cursor:pointer;
    padding:4px 6px;
  }

  main{padding:16px 16px 8px;}

  nav.bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--ink); border-top:1px solid #443f37;
    display:flex; justify-content:space-around; align-items:center;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottomnav button{
    background:none; border:none; color:#B7AF9E; font-family:var(--body);
    font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:4px 6px; cursor:pointer; flex:1;
  }
  nav.bottomnav button .ic{font-size:19px; line-height:1;}
  nav.bottomnav button.active{color:var(--gold);}

  h1.page-title{
    font-family:var(--display); font-size:24px; font-weight:600; margin:4px 0 2px;
  }
  p.page-sub{color:var(--ink-soft); font-size:13px; margin:0 0 18px;}
  .eyebrow{
    font-size:10.5px; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold-deep);
    font-weight:600; margin-bottom:4px;
  }

  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid var(--line); padding:16px; margin-bottom:12px;
  }
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .stat-card{
    background:var(--card); border-radius:var(--radius); border:1px solid var(--line);
    padding:14px; box-shadow:var(--shadow);
  }
  .stat-card .num{font-family:var(--display); font-size:28px; font-weight:700; color:var(--ink);}
  .stat-card .label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.6px;}

  .ficha{
    position:relative; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px 16px 14px; margin-bottom:12px; box-shadow:var(--shadow);
    cursor:pointer;
  }
  .ficha::before{
    content:""; position:absolute; top:0; right:0; width:0; height:0;
    border-style:solid; border-width:0 22px 22px 0; border-color:transparent var(--gold) transparent transparent;
    border-top-right-radius:var(--radius);
  }
  .ficha .marca-nome{font-family:var(--display); font-size:17px; font-weight:600;}
  .ficha .meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .ficha .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .tag{
    font-size:10.5px; padding:3px 9px; border-radius:20px; background:var(--paper-alt);
    border:1px solid var(--line); color:var(--ink-soft);
  }
  .nota-stamp{
    position:absolute; bottom:14px; right:14px; width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-family:var(--display);
    font-weight:700; font-size:14px; border:2px solid var(--gold); color:var(--gold-deep);
  }
  .status-badge{
    display:inline-block; font-size:10.5px; font-weight:600; padding:3px 10px; border-radius:20px;
    margin-top:8px;
  }
  .status-Aprovada, .status-Parceria-ativa{background:#E3EFE7; color:var(--sage-deep);}
  .status-Em-análise{background:#FBEFD2; color:#8A6A16;}
  .status-Reprovada{background:#F6E1DA; color:var(--rust);}
  .status-Contato-iniciado, .status-Em-negociação{background:#EAE6F4; color:#5B4E8C;}

  label{display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin:12px 0 5px; text-transform:uppercase; letter-spacing:.4px;}
  input, select, textarea{
    width:100%; font-family:var(--body); font-size:14.5px; padding:10px 12px;
    border:1px solid var(--line); border-radius:10px; background:var(--paper-alt); color:var(--ink);
  }
  textarea{min-height:70px; resize:vertical;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-family:var(--body); font-weight:600; font-size:13.5px; padding:11px 18px;
    border-radius:10px; border:none; cursor:pointer;
  }
  .btn-primary{background:var(--ink); color:var(--paper);}
  .btn-primary:active{background:#1c1915;}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--ink);}
  .btn-danger{background:none; color:var(--rust); border:1px solid #ecc9bb;}
  .btn-block{width:100%; margin-top:18px;}
  .fab{
    position:fixed; right:18px; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:25;
    width:54px; height:54px; border-radius:50%; background:var(--gold); color:var(--ink);
    border:none; font-size:26px; box-shadow:0 4px 16px rgba(46,42,38,0.28); cursor:pointer;
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(46,42,38,0.5); z-index:40;
    display:flex; align-items:flex-end;
  }
  .modal-sheet{
    background:var(--paper); width:100%; max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  .modal-sheet h2{font-family:var(--display); font-size:19px; margin:2px 0 4px;}
  .modal-close{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:var(--ink-soft);}
  .modal-header{display:flex; justify-content:space-between; align-items:center;}

  .empty-state{text-align:center; padding:40px 16px; color:var(--ink-soft);}
  .empty-state .ic{font-size:32px; display:block; margin-bottom:8px;}
  .row-between{display:flex; justify-content:space-between; align-items:center;}
  .divider{height:1px; background:var(--line); margin:16px 0;}
  .small{font-size:12px; color:var(--ink-soft);}
  .match-score{
    display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
    border-radius:50%; font-family:var(--mono); font-weight:600; font-size:12px;
    background:var(--paper-alt); border:1px solid var(--line);
  }
  .match-score.high{background:#E3EFE7; border-color:#bcdbc6; color:var(--sage-deep);}
  .rank-pos{
    font-family:var(--display); font-weight:700; font-size:20px; color:var(--gold-deep);
    width:34px; text-align:center; flex-shrink:0;
  }
  .toast{
    position:fixed; bottom:calc(96px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:30px; font-size:13px;
    z-index:60; box-shadow:var(--shadow); opacity:0; transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  a{color:var(--sage-deep);}

  #login-screen{
    min-height:100vh; display:flex; flex-direction:column; justify-content:center;
    padding:32px 28px; background:var(--ink); color:var(--paper);
  }
  #login-screen .brand{font-family:var(--display); font-size:26px; margin-bottom:2px;}
  #login-screen .brand small{display:block; font-size:11px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; margin-top:4px;}
  #login-screen form{margin-top:32px;}
  #login-screen label{color:#C9C2B0;}
  #login-screen input{background:#3A352E; border-color:#4a443b; color:var(--paper);}
  #login-screen .btn-primary{background:var(--gold); color:var(--ink); width:100%; margin-top:18px;}
  #login-screen .err{color:#e6a08c; font-size:12.5px; margin-top:10px; min-height:16px;}

  @media (min-width:480px){
    .stat-grid{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="brand">Curadoria de Moda<small>CRM Pessoal · Fabiana Martins</small></div>
  <form id="login-form">
    <label>E-mail</label>
    <input type="email" id="login-email" required autocomplete="username" />
    <label>Senha</label>
    <input type="password" id="login-password" required autocomplete="current-password" />
    <button class="btn btn-primary" type="submit">Entrar</button>
    <div class="err" id="login-error"></div>
  </form>
</div>

<div id="app" style="display:none;">
  <header class="topbar">
    <div class="brand">Curadoria de Moda<small>CRM Pessoal</small></div>
    <button class="icon-btn" id="logout-btn" title="Sair">⏻</button>
  </header>
  <main id="view-root"></main>
  <button class="fab" id="fab-add" style="display:none;">+</button>
  <nav class="bottomnav">
    <button data-view="dashboard" class="active"><span class="ic">◆</span>Painel</button>
    <button data-view="marcas"><span class="ic">✦</span>Marcas</button>
    <button data-view="lojistas"><span class="ic">⌂</span>Lojistas</button>
    <button data-view="matching"><span class="ic">⇄</span>Matching</button>
    <button data-view="mais"><span class="ic">⋯</span>Mais</button>
  </nav>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script type="module" src="js/supabase-config.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(console.error);
    });
  }
</script>

</body>
</html>
